<h2>Trang Admin</h2>

<div class="dashboard-cards">
  <div class="card">
    <h3>Tổng Users</h3>
    <p>{{ totalUsers }}</p>
  </div>

  <div class="card">
    <h3>Tổng tiền đầu tư</h3>
    <p>{{ totalInvestment | currency:'VND':'symbol':'1.0-0' }}</p>
  </div>

  <div class="card">
    <h3>Dự án đang chờ</h3>
    <p>{{ pendingProjects }}</p>
  </div>
</div>

<h3 class="section-title">Hành động nhanh</h3>

<div class="admin-actions">
  <button class="action-btn" routerLink="/admin/projects">
    Quản lý Projects
  </button>

  <button class="action-btn" routerLink="/admin/users">
    Quản lý Users
  </button>

  <button class="action-btn" routerLink="/admin/project-owner-applications">
    Duyệt Project Owner
  </button>

  <button class="action-btn" routerLink="/admin/transactions">
    Quản lý giao dịch
  </button>

  <button class="action-btn" routerLink="/admin/reports">
    Báo cáo hệ thống
  </button>
</div>
