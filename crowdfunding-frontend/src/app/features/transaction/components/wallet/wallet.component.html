<div class="wallet-container">

  <h1>💰 Ví của tôi</h1>
  <!-- BALANCE CARD -->
  <div class="balance-card" *ngIf="wallet">
    <p class="label">Số dư ví</p>
    <h2>{{ wallet.balance | currency:'VND' }}</h2>
  </div>

  <p class="wallet-message error" *ngIf="errorMessage">{{ errorMessage }}</p>
  <p class="wallet-message success" *ngIf="successMessage">{{ successMessage }}</p>

  <!-- ACTIONS -->
  <div class="wallet-actions">

    <!-- FUND IN -->
    <div class="action-card fund-in">
      <h3>Nạp tiền</h3>

      <input type="number" min="1" [(ngModel)]="amountFundIn" placeholder="Số tiền" />

      <!-- Stripe Card Element -->
      <div id="card-element" class="card-element"></div>
      <div id="card-errors" class="card-errors"></div>

      <button [disabled]="isProcessing" (click)="fundIn()">Nạp tiền</button>
    </div>

  </div>

</div>
