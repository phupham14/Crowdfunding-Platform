<h2>Báo cáo danh mục đầu tư</h2>

<div class="summary">
  <div class="card">
    <h3>Tổng số tiền đầu tư</h3>
    <p>{{ totalInvested | currency:'VND' }}</p>
  </div>
  <div class="card">
    <h3>Số lượng đầu tư</h3>
    <p>{{ investmentCount }}</p>
  </div>
</div>

<h3>Phân bổ đầu tư</h3>
<div style="max-width: 400px; margin-bottom: 2rem;">
  <canvas baseChart
          [data]="allocationData"
          [options]="allocationOptions"
          chartType="pie">
  </canvas>
</div>

<h3>Danh sách đầu tư</h3>
<table>
  <thead>
    <tr>
      <th>Dự án</th>
      <th>Tên</th>
      <th>Số tiền</th>
      <th>Ngày</th>
    </tr>
  </thead>
  <tbody>
    <tr *ngFor="let inv of investments">
      <td>{{ inv.project_id }}</td>
      <td>{{ inv.project_name }}</td>
      <td>{{ inv.amount | currency:'VND' }}</td>
      <td>{{ inv.created_at | date:'short' }}</td>
    </tr>
  </tbody>
</table>
